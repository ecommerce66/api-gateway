server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: flowable-workflow
  
  datasource:
    url: jdbc:h2:mem:flowable
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
      path: /h2-console
      
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
flowable:
  async-executor-activate: false
  database-schema-update: true
  check-process-definitions: false
  
logging:
  level:
    org.flowable: DEBUG
    org.springframework.web: DEBUG
    root: INFO
    
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics